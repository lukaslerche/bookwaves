services:
  feig:
    image: ghcr.io/lukaslerche/bookwaves-feig:latest
    container_name: feig
    # platform: linux/amd64 # Uncomment when running on Apple Silicon and your Docker complains about architecture
    ports:
      - '7070:7070'
      - '20001-20020:20001-20020' # Port range for the WebSocket servers
    volumes:
      # REQUIRED: Mount your configuration file
      # Copy config.example.yaml to config.yaml and customize before running
      - ./feig.yaml:/app/config/config.yaml:ro
    restart: unless-stopped

  bookwaves:
    image: ghcr.io/lukaslerche/bookwaves:latest
    container_name: bookwaves
    # Not published: reach the app through nginx, which tells SvelteKit the public origin
    environment:
      HOST_HEADER: x-forwarded-host
      PROTOCOL_HEADER: x-forwarded-proto # Set by nginx.conf so SvelteKit knows the public origin, see https://svelte.dev/docs/kit/adapter-node#Environment-variables-PROTOCOL_HEADER-HOST_HEADER-and-PORT_HEADER
    volumes:
      # REQUIRED: Mount your configuration file
      # Copy config.example.yaml to config.yaml and customize before running
      # If no config.yaml is provided, the the example config will with mock LMS and middleware is used
      - ./bookwaves.yaml:/app/config/config.yaml:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: bw-proxy
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bookwaves
      - feig
    restart: unless-stopped
