server {
  listen 80;

  location / {
    proxy_pass http://bookwaves:3000;
    # Lets SvelteKit derive the public origin (see PROTOCOL_HEADER/HOST_HEADER in docker-compose.yml)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location /feig/ {
    proxy_pass http://feig:7070/;
  }
}
